name: Validar interface em navegador

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Navegador móvel e desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar projeto
        run: npm ci
      - name: Instalar Playwright para a execução do teste
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Gerar site para prévia
        run: npm run build
      - name: Abrir site e validar 16 páginas
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/seu-quintal-preview.log 2>&1 &
          for tentativa in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/smoke-visual.mjs
      - name: Guardar capturas visuais
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: capturas-visuais
          path: artifacts/visual/
          retention-days: 7
          if-no-files-found: ignore
